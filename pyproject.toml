[tool.poetry]
name = "pythonproject1"
version = "0.1.0"
description = ""
authors = ["Your Name <you@example.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.13"
poetry-core = "^2.2.1"
python-dotenv = "^1.2.1"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
lint = [
    "flake8 (>=7.3.0,<8.0.0)",
    "mypy (>=1.18.2,<2.0.0)",
    "black (>=25.9.0,<26.0.0)",
    "isort (>=6.0.1,<7.0.0)"
]
dev = [
    "pytest (>=8.4.2,<9.0.0)"
]


[tool.mypy]
disallow_untyped_defs = true
warn_return_any = true
exclude = "venv"



[tool.black]
line-length = 79

exclude = '''
/(
    \.git
    | \.venv
    | build
    | dist
)/
'''



[tool.isort]
line_length = 79


